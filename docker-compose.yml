# Local run of all six workloads. Copy .env.example -> .env, set LLM_API_KEY,
# then: docker compose up --build
#
# Non-secret values fall back to the docker-compose defaults below, so this
# runs even before you edit .env; .env overrides any of them.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  cowboy-service:
    build: ./services/cowboy-service
    environment:
      PORT: "8001"
      # TrueFoundry AI Gateway (OpenAI-compatible); values come from .env.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-openai-main/gpt-4o-mini}
    # Internal only: no ports published to the host.

  osho-service:
    build: ./services/osho-service
    environment:
      PORT: "8002"
      # TrueFoundry AI Gateway (OpenAI-compatible); values come from .env.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-openai-main/gpt-4o-mini}
    # Internal only: no ports published to the host.

  control-plane:
    build: ./services/control-plane
    environment:
      PORT: "8000"
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@postgres:5432/appdb}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      COWBOY_SERVICE_URL: ${COWBOY_SERVICE_URL:-http://cowboy-service:8001}
      OSHO_SERVICE_URL: ${OSHO_SERVICE_URL:-http://osho-service:8002}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      LOGIN_EMAIL: ${LOGIN_EMAIL:-tester@wns.com}
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:-halotest}
      UI_ORIGIN: ${UI_ORIGIN:-*}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cowboy-service:
        condition: service_started
      osho-service:
        condition: service_started

  ui:
    build: ./ui
    environment:
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      - control-plane

volumes:
  pgdata:
