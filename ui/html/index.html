<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YALO</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav">
    <a href="index.html" class="brand">YALO</a>
    <nav class="nav-links">
      <button type="button" class="persona-tab active" data-persona="cowboy" hidden>Cowboy</button>
      <button type="button" class="persona-tab" data-persona="osho" hidden>Osho</button>
      <a href="about.html">About</a>
      <button type="button" id="logout" class="logout-btn" hidden>Log out</button>
    </nav>
  </header>

  <main>
    <!-- Login view -->
    <section id="login-view" class="login" hidden>
      <h1>Sign in</h1>
      <p class="sub">Only the fixed test user may log in.</p>
      <form id="login-form">
        <label>Email
          <input id="email" type="email" value="tester@wns.com" autocomplete="username" />
        </label>
        <label>Password
          <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
        </label>
        <button type="submit">Log in</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </section>

    <!-- Chat view (no box, full-height) -->
    <section id="chat-view" class="chat" hidden>
      <div class="chat-heading">Chatting with <strong id="persona-name">Cowboy</strong></div>
      <div id="messages" class="messages" aria-live="polite"></div>
      <div class="composer">
        <form id="chat-form">
          <input id="message" type="text" placeholder="Say something…" autocomplete="off" />
          <button type="submit" id="send-btn">Send</button>
        </form>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
