server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the static pages; fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.js is generated at container start from CONTROL_PLANE_URL; never cache it.
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
